# Configuration file for newsletters to download
# All fields except 'url' are optional and have sensible defaults

# Global settings (applied to all newsletters unless overridden)
settings:
  default_limit: 3
  download_metadata: true
  create_index: true
  retry_failed: true

# Newsletter configurations
newsletters:
  - name: "Astral Codex Ten"
    url: "https://astralcodexten.substack.com"
    author: "Scott Alexander"
    description: "Science, medicine, philosophy, and politics"
    content_type: "academic"
    role: "independent-researcher"
    topics: ["science", "medicine", "philosophy", "politics"]
    tags: ["science", "medicine", "philosophy", "independent", "pseudonymous"]
    limit: 5
    enabled: true

  - name: "Claire Berlinski's Substack"
    url: "https://claireberlinski.substack.com"
    author: "Claire Berlinski"
    description: "International affairs and political commentary"
