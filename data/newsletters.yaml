    wikipedia: "https://en.wikipedia.org/wiki/Slate_Star_Codex"
    description: "Science, medicine, philosophy, and politics with a focus on Bayesian reasoning"
    content_type: "academic"
    role: "independent-researcher"
    topics: ["science", "medicine", "philosophy", "politics"]
    tags: ["bayesianism", "longtermism", "meta-politics", "political-epistemology", "policy-analysis"]
    limit: 3
    enabled: true

