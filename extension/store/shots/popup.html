<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pAIa popup screenshot</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; gap: 64px;
        background: #faf9f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .pitch { max-width: 440px; color: #1a1a1a; }
      .pitch h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 16px; }
      .pitch h1 span { color: #ff6719; }
      .pitch p { font-size: 18px; color: #6b6b6b; line-height: 1.5; }
      .frame { width: 360px; height: 600px; border-radius: 14px; overflow: hidden;
        box-shadow: 0 8px 30px rgba(0,0,0,0.12); border: 1px solid #e2e2df; background: #fff; }
      iframe { width: 360px; height: 600px; border: 0; }
    </style>
    <script>
      const P = "https://nationalparkjournal.substack.com/p/", C = "https://climatehope.substack.com/p/";
      localStorage.setItem("paia.ext.feedback", JSON.stringify({
        [P + "a"]: { like: true, read: true }, [P + "b"]: { like: true },
        [C + "c"]: { read: true }, [C + "d"]: { notint: true }
      }));
      localStorage.setItem("paia.ext.snapshot", JSON.stringify([
        { id: P + "a", url: P + "a", title: "Wildlife in the West", publication: "nationalparkjournal", author: "National Park Journal", publishedAt: "" },
        { id: P + "b", url: P + "b", title: "3 Alpine Lakes Worth Every Step", publication: "nationalparkjournal", author: "National Park Journal", publishedAt: "" },
        { id: C + "c", url: C + "c", title: "Your Weekly Climate Wins", publication: "climatehope", author: "Climate Hope", publishedAt: "" },
        { id: C + "d", url: C + "d", title: "A Longer Read", publication: "climatehope", author: "Climate Hope", publishedAt: "" }
      ]));
      localStorage.setItem("paia.ext.settings", JSON.stringify({ rerank: true, sort: "recommended", autoRead: true, showHidden: false, weights: { like: 3, read: 1, notint: -3, hide: -5 } }));
    </script>
  </head>
  <body>
    <div class="pitch">
      <h1>Your feed, <span>your signals.</span></h1>
      <p>See the publications you actually read rise to the top — with a private dashboard of the signals behind every ranking.</p>
    </div>
    <div class="frame"><iframe src="../../popup.html"></iframe></div>
  </body>
</html>
